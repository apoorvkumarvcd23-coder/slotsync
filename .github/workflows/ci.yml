name: foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: PostgreSQL migrations, HTTP and race checks (Testcontainers)
        run: ./mvnw -B -ntp verify
      - name: React tests and type-checked build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
          npx playwright install --with-deps chromium
      - name: Start the clean demo
        run: |
          python3 scripts/init_demo.py
          docker compose up --build --wait --wait-timeout 180
      - name: Browser checks against the real app
        working-directory: frontend
        run: npm run test:e2e
      - name: Readiness detects database outage and recovery
        run: |
          docker compose stop db
          status="$(curl --silent --max-time 20 --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/actuator/health/readiness)"
          test "$status" = 503
          docker compose up --wait --wait-timeout 90
          curl --fail --silent http://127.0.0.1:8080/actuator/health/readiness
      - name: Demo logs
        if: failure()
        run: docker compose logs --no-color --tail 120
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-evidence
          path: |
            target/failsafe-reports/
            frontend/test-results/*.png
          retention-days: 14
      - name: Stop demo
        if: always()
        run: docker compose down
